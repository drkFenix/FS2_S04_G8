<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - HuertoHogar</title>
    <!-- Google Fonts! -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Encabezado de la página de registro! -->
    <header>
        <div class="logo" style="display: flex; align-items: center; gap: 1rem;">
            <img src="img/logo.png" alt="Logo HuertoHogar" style="height: 60px;">
            <div>
                <h1 style="margin: 0;">HuertoHogar</h1>
                <p style="margin: 0;">Del campo al hogar</p>
            </div>
        </div>
        <!-- Menú de navegación! -->
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="login.html">Iniciar Sesión</a></li>
                <li><a href="registro.html">Registro</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contenedor principal del formulario! -->
    <main>
        <section class="formulario-seccion">
            <h2>Crear Cuenta</h2>
            <!-- Formulario de registro de usuario! -->
            <form id="registroForm" novalidate>
                <div class="form-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" required autocomplete="name" placeholder="Ej: Juan Pérez">
                    <span class="error-msg" id="errorNombre"></span>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" required autocomplete="email" placeholder="ejemplo@correo.com">
                    <span class="error-msg" id="errorEmail"></span>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="Mínimo 8 caracteres">
                    <span class="error-msg" id="errorPassword"></span>
                </div>

                <button type="submit" class="btn-submit">Registrarse</button>
                <p style="text-align: center; margin-top: 1.5rem;">¿Ya tienes cuenta? <a href="login.html" style="color: var(--color-acento-verde); font-weight: bold;">Inicia sesión aquí</a></p>
            </form>
        </section>
    </main>

    <!-- Pie de página! -->
    <footer>
        <p>&copy; 2024 HuertoHogar. Todos los derechos reservados.</p>
    </footer>

    <!-- Script de validación! -->
    <script src="js/script.js"></script>
</body>
</html>
